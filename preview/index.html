<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude-Codex pet · 动作预览</title><style>*{box-sizing:border-box}body{margin:0;background:#faf5ed;color:#392d25;font:15px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1080px;margin:38px auto;padding:0 24px}h1{font-size:30px;margin:0}p{color:#786451}header{margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fffdf9;border:1px solid #e9dcc9;border-radius:18px;padding:18px;text-align:center}.stage{height:228px;display:grid;place-items:center}.sprite{width:192px;height:208px;background-image:url('../chengli-tsundere/spritesheet.webp');background-size:1536px 2288px;background-repeat:no-repeat}.label{font-weight:bold}.note{font-size:12px;color:#887867}.look{margin:24px 0;border:1px solid #e9dcc9;border-radius:18px;padding:22px;background:#f1e4d1;text-align:center}.look .sprite{margin:auto}button{border:1px solid #d8b995;border-radius:99px;background:white;color:#66462e;padding:8px 18px;cursor:pointer}footer{font-size:12px;color:#887867;margin:20px 0}.dark{background:#211b18;color:#f3e5d2}.dark .card{background:#332922;border-color:#574839}.dark p,.dark footer,.dark .note{color:#c1aa91}.dark .look{background:#403025;border-color:#574839}</style>
<main><header><h1>Claude-Codex pet · 余光傲娇版</h1><p>「本小姐只是碰巧在这里，才不是特意等你。」</p><button id="pause">暂停动画</button> <button id="theme">切换深色背景</button></header><section class="grid" id="grid"></section><section class="look" id="look"><div class="label">跟随你的目光</div><div class="sprite" id="gaze"></div><div class="note">在这块区域内移动鼠标，查看 16 个注视方向；离开后自动轮播。</div></section><footer>Codex v2 动作预览 · 台词仅作人设备忘，宠物包不自动改变助手语气。</footer></main>
<script>
const rows=[['idle','抱臂待机',[280,110,110,140,140,320]],['running-right','向右跑 · 余光瞥你',[120,120,120,120,120,120,120,220]],['running-left','向左跑 · 嫌弃地看你',[120,120,120,120,120,120,120,220]],['waving','原版动作 · 傲娇挥手',[140,140,140,280]],['jumping','开心小跳',[140,140,140,140,280]],['failed','鼓嘴不服气',[140,140,140,140,140,140,140,240]],['waiting','等你回应',[150,150,150,150,150,260]],['running','认真思考',[120,120,120,120,120,220]],['review','检查成果',[150,150,150,150,150,280]]];
const els=rows.map((r,i)=>{let c=document.createElement('article');c.className='card';c.innerHTML=`<div class="stage"><div class="sprite" data-row="${i}"></div></div><div class="label">${r[1]}</div>`;grid.append(c);return c.querySelector('.sprite')});let paused=false,last=performance.now(),elapsed=0,manual=null;function frame(el,r,c){el.style.backgroundPosition=`${-192*c}px ${-208*r}px`}function tick(now){if(!paused)elapsed+=now-last;last=now;rows.forEach((r,i)=>{let t=elapsed%r[2].reduce((a,b)=>a+b,0),c=0;while(t>=r[2][c]&&c<r[2].length-1){t-=r[2][c++]}frame(els[i],i,c)});let d=manual===null?Math.floor(elapsed/320)%16:manual;if(d===-1)frame(gaze,0,0);else frame(gaze,9+Math.floor(d/8),d%8);requestAnimationFrame(tick)}requestAnimationFrame(tick);pause.onclick=()=>{paused=!paused;pause.textContent=paused?'播放动画':'暂停动画'};theme.onclick=()=>document.body.classList.toggle('dark');look.onpointermove=e=>{let b=gaze.getBoundingClientRect(),dx=e.clientX-b.left-b.width/2,dy=e.clientY-b.top-b.height/2;manual=Math.hypot(dx,dy)<20?-1:Math.round(((Math.atan2(dx,-dy)*180/Math.PI+360)%360)/22.5)%16};look.onpointerleave=()=>manual=null;
</script></html>
