<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude-Codex pet · 高清重绘</title>
<style>*{box-sizing:border-box}body{margin:0;background:#faf6ef;color:#422f25;font:15px/1.7 "Microsoft YaHei",sans-serif}main{max-width:1260px;margin:32px auto;padding:0 24px}h1{margin:0;font-size:30px}p{color:#856c59}button,a.link{background:#fffdf9;color:#66452e;border:1px solid #d8be9f;border-radius:24px;padding:9px 17px;margin:4px;cursor:pointer;text-decoration:none;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:24px}.card,.look{background:#fffdf9;border:1px solid #e9ddce;border-radius:18px;padding:16px;text-align:center}.stage{height:230px;display:grid;place-items:center}.sprite{width:192px;height:208px;background-image:url('../chengli-tsundere/spritesheet.webp?v=3e03f7d98cf2');background-size:1536px 2288px;background-repeat:no-repeat}.look{margin-top:20px}.look .sprite{margin:auto}.label{font-weight:bold}.note{font-size:12px;color:#947b67}.dark{background:#202127;color:#f4e7d7}.dark .card,.dark .look{background:#292b32;border-color:#484b55}.dark p,.dark .note{color:#bead9e}.zoom .grid{grid-template-columns:repeat(auto-fit,minmax(410px,1fr))}.zoom .stage{height:438px}.zoom .sprite{width:384px;height:416px;background-image:url('../art/spritesheet-master-2x.webp?v=94885cc6d661');background-size:3072px 4576px}footer{margin:24px 0;font-size:13px;color:#947b67}</style>
<main><h1>Claude-Codex pet · 高清重绘版</h1><p>「本小姐只是碰巧在这里，才不是特意等你。」</p><button id="pause">暂停动画</button><button id="theme">切换深色背景</button><button id="zoom">查看 2 倍高清</button><a class="link" href="contact-sheet.png">整张动作总图</a><section class="grid" id="grid"></section><section class="look" id="look"><div class="label">跟随你的目光</div><div class="sprite" id="gaze"></div><div class="note">在这里移动鼠标，查看注视方向；移开后自动轮播。</div></section><footer>v1.1.0 · 原生透明高清重绘 · 左跑逐帧镜像右跑</footer></main>
<script>const rows=[['抱臂待机',[280,110,110,140,140,320]],['向右小跑',[120,120,120,120,120,120,120,220]],['向左小跑',[120,120,120,120,120,120,120,220]],['傲娇挥手',[140,140,140,280]],['开心小跳',[140,140,140,140,280]],['鼓嘴不服气',[140,140,140,140,140,140,140,240]],['等你回应',[150,150,150,150,150,260]],['认真思考',[120,120,120,120,120,220]],['检查成果',[150,150,150,150,150,280]]];const els=rows.map(r=>{let c=document.createElement('article');c.className='card';c.innerHTML='<div class="stage"><div class="sprite"></div></div><div class="label">'+r[0]+'</div>';grid.append(c);return c.querySelector('.sprite')});let paused=false,z=1,last=performance.now(),elapsed=0,manual=null;function frame(el,r,c){el.style.backgroundPosition=(-192*z*c)+'px '+(-208*z*r)+'px'}function tick(now){if(!paused)elapsed+=now-last;last=now;rows.forEach((r,i)=>{let t=elapsed%r[1].reduce((a,b)=>a+b,0),c=0;while(t>=r[1][c]&&c<r[1].length-1)t-=r[1][c++];frame(els[i],i,c)});let d=manual===null?Math.floor(elapsed/300)%16:manual;if(d<0)frame(gaze,0,6);else frame(gaze,9+Math.floor(d/8),d%8);requestAnimationFrame(tick)}requestAnimationFrame(tick);pause.onclick=()=>{paused=!paused;pause.textContent=paused?'播放动画':'暂停动画'};theme.onclick=()=>document.body.classList.toggle('dark');zoom.onclick=()=>{z=z===1?2:1;document.body.classList.toggle('zoom',z===2);zoom.textContent=z===2?'返回桌宠尺寸':'查看 2 倍高清'};look.onpointermove=e=>{let b=gaze.getBoundingClientRect(),dx=e.clientX-b.left-b.width/2,dy=e.clientY-b.top-b.height/2;manual=Math.hypot(dx,dy)<20*z?-1:Math.round(((Math.atan2(dx,-dy)*180/Math.PI+360)%360)/22.5)%16};look.onpointerleave=()=>manual=null;</script></html>
